name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build Release
        run: cargo build --release
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: LOSANGELES-Windows
          path: target/release/LOSANGELES.exe
